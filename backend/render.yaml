services:
  - type: web
    name: activ-fitness-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://activ-fitness.vercel.app
      - key: ADMIN_URL
        value: https://activ-fitness-admin.vercel.app
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123