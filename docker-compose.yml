services:
  db:
    image: postgres:18-alpine
    container_name: activ-db
    environment:
      POSTGRES_USER: activ
      POSTGRES_PASSWORD: activpass
      POSTGRES_DB: activdb
    volumes:
      - db-data:/var/lib/postgresql
      - ./backend/scripts/migrate-to-neon.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activ -d activdb"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    container_name: activ-fitness
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://activ:activpass@db:5432/activdb
      - JWT_SECRET=docker-test-secret
      - FRONTEND_URL=http://localhost:5173
    restart: unless-stopped

volumes:
  db-data:
